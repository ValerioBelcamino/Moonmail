<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Moonmail · Which robot can do each job?</title>
    <style>
      html, body { height: 100%; margin: 0; background: #071416; }
      video { display: block; width: 100%; height: 100%; object-fit: contain; }
    </style>
  </head>
  <body>
    <video controls playsinline preload="metadata" aria-label="Moonmail competition film">
      <source src="/api/film?cut=submission" type="video/mp4">
      <track kind="captions" src="film.en.vtt?cut=submission" srclang="en" label="English">
      <a href="/api/film">Download the film</a>
    </video>
    <script>
      const video = document.querySelector('video');
      function seekToChapter() {
        const match = /^#t=(\d+(?:\.\d+)?)$/.exec(location.hash);
        if (match && video.readyState) video.currentTime = Math.min(Number(match[1]), video.duration);
      }
      video.addEventListener('loadedmetadata', seekToChapter, { once: true });
      window.addEventListener('hashchange', seekToChapter);
      seekToChapter();
    </script>
  </body>
</html>
