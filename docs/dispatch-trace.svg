<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 637" role="img" aria-labelledby="title desc">
  <title id="title">Bag 47. Three graph reads from the driver run.</title>
  <desc id="desc">The first DAG joins loading and signing at departure. The fault invalidates the load and blocks the release. Revision two preserves the signature assignment and adds a repair before a new load.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#f1eee4}.id,.tick,.legend{font-family:ui-monospace,monospace}.headline{font-size:18px;font-weight:650}.tick{fill:#efd199;font-size:14px}.label{font-size:15px;font-weight:600}.id{font-size:12px;fill:#d6dfd8}.legend{font-size:12px;fill:#bdcec9}path{fill:none;stroke-width:2.1}</style>
  <rect width="1020" height="637" rx="16" fill="#0c1c26" />
  <defs>
    <marker id="normal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#8fa8ae" />
    </marker>
    <marker id="done" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#8bcaa6" />
    </marker>
    <marker id="stale" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#f49b88" />
    </marker>
    <marker id="added" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#edc177" />
    </marker>
  </defs>
